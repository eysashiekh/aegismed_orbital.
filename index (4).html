<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">

<title>AegisMed Orbital – Crew health command</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="preconnect" href="https://cdnjs.cloudflare.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700&family=Sora:wght@300;400;600&display=swap" rel="stylesheet" media="print" onload="this.media='all'">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css" media="print" onload="this.media='all'">
<style>
:root{--bg:#070b14;--cy:#38bdf8;--ok:#22c55e;--warn:#facc15;--crit:#ef4444;--txt:#e6f1ff;--mut:#8aa0bd;--line:color-mix(in srgb,var(--cy) 28%,transparent);--pn:rgba(10,18,36,.68);--hd:Orbitron,Sora,sans-serif}
*{box-sizing:border-box;margin:0}[hidden]{display:none!important}
body{font:14px/1.5 Sora,system-ui,sans-serif;color:var(--txt);background:var(--bg);min-height:100vh;overflow-x:hidden}
body::before{content:"";position:fixed;inset:0;z-index:0;pointer-events:none;background:linear-gradient(var(--line) 1px,transparent 1px) 0 0/48px 48px,linear-gradient(90deg,var(--line) 1px,transparent 1px) 0 0/48px 48px;opacity:.12;mask:linear-gradient(#000,transparent 85%)}
#space{position:fixed;inset:0;width:100%;height:100%;z-index:0}
button,input,select,textarea{font:inherit;color:inherit}button{cursor:pointer}
:focus-visible{outline:2px solid var(--cy);outline-offset:2px}
#boot{position:fixed;inset:0;z-index:99;background:var(--bg);display:grid;place-content:center;text-align:center;gap:14px;transition:opacity .7s,visibility .7s}
#boot.off{opacity:0;visibility:hidden}#boot h1{font:700 1.6rem var(--hd);letter-spacing:.12em}
#boot i{display:block;height:3px;width:240px;background:rgba(255,255,255,.1);margin:auto;overflow:hidden}#boot i::after{content:"";display:block;height:100%;background:var(--cy);animation:ld 1.5s ease-out forwards}
@keyframes ld{from{width:0}to{width:100%}}
.app{position:relative;z-index:1;display:grid;grid-template-columns:240px 1fr;min-height:100vh}
#side{position:sticky;top:0;height:100vh;padding:18px 12px;background:rgba(7,12,24,.8);backdrop-filter:blur(14px);border-right:1px solid var(--line);display:flex;flex-direction:column;gap:6px;z-index:20;transition:transform .45s cubic-bezier(.2,.8,.2,1)}
.logo{font:700 1.05rem var(--hd);letter-spacing:.08em;padding:4px 10px 14px}.logo small{display:block;font:300 .7rem Sora;color:var(--mut);letter-spacing:0}
.nav{display:flex;gap:12px;align-items:center;background:none;border:0;border-left:3px solid transparent;border-radius:0 10px 10px 0;padding:10px 12px;text-align:left;color:var(--mut);transition:.25s}
.nav:hover{background:rgba(56,189,248,.08);color:var(--txt);padding-left:18px}
.nav.on{color:var(--txt);border-left-color:var(--cy);background:linear-gradient(90deg,color-mix(in srgb,var(--cy) 22%,transparent),transparent)}
.nav b{width:18px;text-align:center;color:var(--cy);font-weight:400}
.me{margin-top:auto;border:1px solid var(--line);border-radius:12px;padding:10px;display:flex;gap:10px;align-items:center}
main{padding:0 20px 40px;min-width:0}
.top{position:sticky;top:0;z-index:10;display:flex;align-items:center;gap:12px;padding:14px 0;background:linear-gradient(var(--bg) 60%,transparent)}
.top h1{font:700 clamp(1rem,2.4vw,1.4rem) var(--hd);letter-spacing:.06em;flex:1}
.ib{background:rgba(10,18,36,.7);border:1px solid var(--line);border-radius:10px;min-width:40px;height:40px;position:relative}
.ib:hover{background:color-mix(in srgb,var(--cy) 20%,transparent)}#menu{display:none}
.badge{position:absolute;top:-6px;right:-6px;background:var(--crit);border-radius:99px;font-size:.65rem;padding:0 6px}
.chip{border:1px solid var(--line);background:var(--pn);border-radius:99px;padding:5px 12px;font-size:.78rem;font-variant-numeric:tabular-nums}
#alert-banner{border:1px solid;border-radius:12px;padding:12px 16px;margin-bottom:14px;backdrop-filter:blur(10px);animation:sl .5s}
#alert-banner.warn{background:rgba(250,204,21,.12);border-color:var(--warn)}
#alert-banner.crit{background:rgba(239,68,68,.16);border-color:var(--crit);animation:sl .5s,pu 1.4s infinite}
#alert-banner span{display:block;font-size:.86rem}
@keyframes sl{from{opacity:0;transform:translateY(-12px)}}@keyframes pu{50%{box-shadow:0 0 28px rgba(239,68,68,.5)}}
#view>*{animation:vin .55s cubic-bezier(.2,.8,.2,1) both}#view>*:nth-child(2){animation-delay:.08s}#view>*:nth-child(3){animation-delay:.16s}#view>*:nth-child(4){animation-delay:.24s}
@keyframes vin{from{opacity:0;transform:translateY(18px) scale(.985)}}
.panel{position:relative;background:var(--pn);border:1px solid var(--line);padding:16px;backdrop-filter:blur(12px);clip-path:polygon(0 0,calc(100% - 18px) 0,100% 18px,100% 100%,18px 100%,0 calc(100% - 18px));box-shadow:inset 0 0 40px color-mix(in srgb,var(--cy) 6%,transparent)}
.panel::after{content:"";position:absolute;top:0;left:0;width:26px;height:2px;background:var(--cy);box-shadow:0 0 10px var(--cy)}
h2{font:500 .92rem var(--hd);letter-spacing:.05em;margin-bottom:10px}h3{font-weight:600}
.mut,small{color:var(--mut);font-size:.8rem}
.vitals{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-bottom:14px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-bottom:14px}.three{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:14px}
.card{background:rgba(7,14,28,.72);border:1px solid var(--line);border-left:4px solid var(--ok);border-radius:12px;padding:12px;transition:.4s}
.card.warn{border-left-color:var(--warn)}.card.crit{border-left-color:var(--crit);box-shadow:0 0 18px rgba(239,68,68,.3)}
.card h3{font-size:.78rem;font-weight:400;color:var(--mut)}
.val{display:flex;align-items:baseline;gap:6px;margin:2px 0 8px}.val b{font:700 1.7rem var(--hd);font-variant-numeric:tabular-nums}.val span{font-size:.75rem;color:var(--mut)}
.bar,.prog{height:5px;background:rgba(255,255,255,.08);border-radius:9px;overflow:hidden}.bar i,.prog i{display:block;height:100%;width:50%;background:var(--ok);border-radius:9px;transition:width .8s,background .4s}
.prog i{background:var(--cy)}.card.warn .bar i{background:var(--warn)}.card.crit .bar i{background:var(--crit)}
.st{font-size:.76rem;margin-top:6px;color:var(--ok)}.card.warn .st{color:var(--warn)}.card.crit .st{color:var(--crit)}
.ch{width:100%;height:170px;display:block}
.row{display:flex;gap:12px;align-items:center;width:100%;background:none;border:0;border-bottom:1px solid rgba(255,255,255,.07);padding:9px 4px;text-align:left}
.row:hover{background:rgba(56,189,248,.07)}.row span{flex:1;display:grid}.row em{font-style:normal;color:var(--cy);font-size:.78rem}
.av{width:38px;height:38px;border-radius:50%;display:grid;place-items:center;font:700 .8rem var(--hd);flex:none;box-shadow:0 0 14px currentColor}
.btn{background:color-mix(in srgb,var(--cy) 14%,transparent);border:1px solid var(--line);border-radius:10px;padding:9px 14px;transition:.2s}
.btn:hover{background:color-mix(in srgb,var(--cy) 32%,transparent)}.btn.d{border-color:var(--crit)}.btn.p{background:var(--cy);color:#04101c;font-weight:600}
.tb{display:flex;gap:10px;flex-wrap:wrap;align-items:center;justify-content:space-between;margin-bottom:14px}
.sc{display:grid;gap:8px}.sc .btn{text-align:left}.sc .btn[aria-pressed=true]{border-color:var(--cy);background:color-mix(in srgb,var(--cy) 30%,transparent)}
.chk{display:flex;gap:10px;align-items:center;padding:10px 0;border-bottom:1px solid rgba(255,255,255,.07);cursor:pointer}.chk input{width:18px;height:18px;accent-color:var(--cy)}
.big{font:700 2.2rem var(--hd);color:var(--cy)}
#body{width:100%;max-height:440px;display:block;margin:auto}
.zone{cursor:pointer}.zone .s{fill:color-mix(in srgb,var(--cy) 10%,transparent);stroke:var(--cy);stroke-width:1.5;transition:.3s}
.zone:hover .s,.zone.sel .s{fill:color-mix(in srgb,var(--cy) 32%,transparent)}.zone.warn .s{stroke:var(--warn);fill:rgba(250,204,21,.16)}.zone.crit .s{stroke:var(--crit);fill:rgba(239,68,68,.25)}
.zone:focus-visible{outline:0}.zone:focus-visible .s{stroke-width:3}.scan{fill:var(--cy);opacity:.55;animation:sc 5s linear infinite}@keyframes sc{to{transform:translateY(420px)}}
label.f{display:grid;gap:4px;margin-bottom:10px;font-size:.8rem;color:var(--mut)}
input,select,textarea{background:rgba(4,10,22,.8);border:1px solid var(--line);border-radius:8px;padding:9px 10px;width:100%}
.sw{display:flex;gap:10px}.sw button{width:34px;height:34px;border-radius:50%;border:2px solid transparent}.sw button.on{border-color:#fff}
.tg{display:flex;justify-content:space-between;align-items:center;padding:11px 0;border-bottom:1px solid rgba(255,255,255,.07)}
.log{padding:9px 0;border-bottom:1px solid rgba(255,255,255,.07);display:flex;gap:10px}.log time{color:var(--mut);font-size:.74rem;min-width:62px}.log.alert{color:#fca5a5}
#ov{position:fixed;inset:0;background:rgba(2,6,14,.6);backdrop-filter:blur(3px);opacity:0;visibility:hidden;transition:.35s;z-index:40}
#dr{position:fixed;top:0;right:0;height:100%;width:min(440px,100%);z-index:41;background:rgba(8,14,28,.94);border-left:1px solid var(--cy);box-shadow:-10px 0 50px rgba(0,0,0,.6);transform:translateX(105%);transition:transform .5s cubic-bezier(.2,.8,.2,1);display:flex;flex-direction:column}
body.dr #dr{transform:none}body.dr #ov{opacity:1;visibility:visible}
#dr header{display:flex;justify-content:space-between;align-items:center;padding:16px 18px;border-bottom:1px solid var(--line)}#dr .bd{padding:18px;overflow:auto;flex:1}
.msg{max-width:85%;padding:9px 12px;border-radius:12px;margin-bottom:8px;animation:vin .4s both}.msg.me2{margin-left:auto;background:color-mix(in srgb,var(--cy) 28%,transparent)}.msg.dr2{background:rgba(255,255,255,.08)}
.sbar{height:8px;background:rgba(255,255,255,.08);border-radius:9px;overflow:hidden;margin:4px 0 12px}.sbar i{display:block;height:100%;width:0;background:var(--cy);transition:width 1.6s ease-out}
@media(max-width:900px){.app{grid-template-columns:1fr}#side{position:fixed;left:0;top:0;width:260px;transform:translateX(-105%)}#side.open{transform:none}#menu{display:block}.vitals{grid-template-columns:repeat(2,1fr)}.two{grid-template-columns:1fr}main{padding:0 12px 40px}.hide{display:none}}
.noanim *{animation:none!important;transition:none!important}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

#scn{position:fixed;inset:0;z-index:60;background:rgba(3,7,16,.94);backdrop-filter:blur(8px);display:grid;place-items:center;padding:16px;overflow:auto;animation:vin .5s both}
.sx{width:min(900px,100%);position:relative;margin:auto}.sx>.ib{position:absolute;right:0;top:0}
.sg{display:grid;grid-template-columns:minmax(150px,260px) 1fr;gap:20px;align-items:center;margin:14px 0}
.sb svg{width:100%;max-height:58vh;display:block}
.so{fill:color-mix(in srgb,var(--cy) 8%,transparent);stroke:var(--cy);stroke-width:1.2;opacity:.5;transition:.3s}
.so.hot{opacity:1;fill:color-mix(in srgb,var(--cy) 40%,transparent);filter:drop-shadow(0 0 8px var(--cy))}
.lz{fill:var(--cy);filter:drop-shadow(0 0 10px var(--cy));animation:lzm 4s ease-in-out infinite alternate}@keyframes lzm{to{transform:translateY(412px)}}
.sr{display:flex;gap:10px;padding:9px 0;border-bottom:1px solid rgba(255,255,255,.07);align-items:center;animation:vin .4s both}.sr b{min-width:128px}.sr small{flex:1}.sr em{font-style:normal;font-size:.78rem}
@media(max-width:600px){.sg{grid-template-columns:1fr}.sb svg{max-height:34vh}.sr b{min-width:104px}}
.mb{margin-bottom:14px}.leaflet-container{background:#070b14;font:inherit}.leaflet-control-attribution{background:rgba(7,11,20,.75)!important;color:var(--mut)!important}.leaflet-control-attribution a{color:var(--cy)!important}.src a{color:var(--cy);word-break:break-all}

#fx{position:fixed;inset:0;pointer-events:none;z-index:30}
#fx.crit{animation:edge 1.6s ease-in-out infinite}@keyframes edge{50%{box-shadow:inset 0 0 90px rgba(239,68,68,.35)}}
#fx.go{animation:fl 1.8s ease-out}@keyframes fl{0%{background:rgba(239,68,68,.35)}100%{background:transparent}}
#fx.go::after{content:"";position:absolute;left:50%;top:50%;width:20px;height:20px;margin:-10px;border-radius:50%;border:3px solid #ef4444;box-shadow:0 0 40px #ef4444;animation:sw 1.8s ease-out}@keyframes sw{to{transform:scale(160);opacity:0}}
#toast{position:fixed;left:50%;bottom:24px;transform:translate(-50%,30px);background:rgba(8,14,28,.95);border:1px solid var(--cy);padding:10px 16px;border-radius:12px;z-index:70;opacity:0;transition:.3s;max-width:90vw;pointer-events:none}#toast.on{opacity:1;transform:translate(-50%,0)}
@keyframes hb{0%,100%{transform:scale(1)}15%{transform:scale(1.13)}30%{transform:scale(1)}45%{transform:scale(1.07)}}
body.big{zoom:1.15}input[type=range]{padding:0;accent-color:var(--cy)}
#prt{display:none}@media print{body::before{display:none}body>*:not(#prt){display:none!important}#prt{display:block!important;background:#fff;color:#000;padding:24px;font-family:Sora,sans-serif}}
.sun,.eimg{width:100%;border-radius:12px;display:block;margin-bottom:6px;background:#000;min-height:120px;object-fit:cover}
.panel{transition:transform .3s,box-shadow .3s}.panel:hover{transform:translateY(-2px);box-shadow:inset 0 0 50px color-mix(in srgb,var(--cy) 14%,transparent)}.card:hover{transform:translateY(-2px)}@media(hover:none){.panel:hover,.card:hover{transform:none}}

/* HUD redesign */
body::after{content:"";position:fixed;inset:0;z-index:0;pointer-events:none;background:repeating-linear-gradient(0deg,rgba(255,255,255,.022) 0 1px,transparent 1px 3px)}
h2{font:500 .8rem var(--hd);letter-spacing:.18em;text-transform:uppercase;color:var(--cy)}h2::before{content:"// ";opacity:.6}
.panel{clip-path:none;border-radius:6px;background:linear-gradient(160deg,rgba(14,28,56,.78),rgba(5,10,22,.84));border-color:color-mix(in srgb,var(--cy) 24%,transparent);box-shadow:0 8px 30px rgba(0,0,0,.45)}
.panel::before,.panel::after{content:"";position:absolute;width:14px;height:14px;pointer-events:none;border:2px solid var(--cy);transition:.3s}
.panel::before{right:-1px;bottom:-1px;border-left:0;border-top:0}.panel::after{left:-1px;top:-1px;background:none;box-shadow:none;border-right:0;border-bottom:0}
.panel:hover::before,.panel:hover::after{width:32px;height:32px;filter:drop-shadow(0 0 6px var(--cy))}
.panel:hover{border-color:color-mix(in srgb,var(--cy) 60%,transparent);box-shadow:0 0 30px color-mix(in srgb,var(--cy) 22%,transparent),0 8px 30px rgba(0,0,0,.45);transform:translateY(-2px)}
.card{position:relative;overflow:hidden;border-radius:6px;border:1px solid color-mix(in srgb,var(--cy) 22%,transparent);background:linear-gradient(160deg,rgba(10,22,44,.86),rgba(4,9,20,.92))}
.card::before{content:"";position:absolute;left:0;top:0;right:0;height:2px;background:var(--ok);box-shadow:0 0 12px var(--ok)}
.card.warn::before{background:var(--warn);box-shadow:0 0 12px var(--warn)}.card.crit::before{background:var(--crit);box-shadow:0 0 12px var(--crit)}
.card h3{text-transform:uppercase;letter-spacing:.12em;font-size:.66rem}.card:hover{transform:translateY(-3px);border-color:var(--cy);box-shadow:0 0 22px color-mix(in srgb,var(--cy) 28%,transparent)}
.bar{border-radius:0;background:repeating-linear-gradient(90deg,rgba(255,255,255,.1) 0 6px,transparent 6px 8px)}.bar i{border-radius:0;box-shadow:0 0 10px currentColor}
.sp{width:100%;height:20px;display:block;margin-top:8px}.sp polyline{fill:none;stroke:var(--cy);stroke-width:1.5;opacity:.8;vector-effect:non-scaling-stroke}
.btn{border-radius:3px;border:0;text-transform:uppercase;letter-spacing:.08em;font-size:.72rem;font-weight:600;padding:11px 16px;background:linear-gradient(135deg,color-mix(in srgb,var(--cy) 28%,transparent),color-mix(in srgb,var(--cy) 8%,transparent));box-shadow:inset 0 0 0 1px color-mix(in srgb,var(--cy) 55%,transparent)}
.btn:hover{background:var(--cy);color:#04101c;box-shadow:0 0 22px var(--cy)}.btn.d{box-shadow:inset 0 0 0 1px var(--crit)}.btn.d:hover{background:var(--crit);color:#fff;box-shadow:0 0 22px var(--crit)}
.btn.p{background:var(--cy);color:#04101c}.btn.p:hover{filter:brightness(1.2);box-shadow:0 0 26px var(--cy)}
.nav{text-transform:uppercase;letter-spacing:.1em;font-size:.72rem;border-radius:0}.nav.on{box-shadow:inset 3px 0 0 var(--cy)}.nav.on b{text-shadow:0 0 10px var(--cy)}
#side{background:linear-gradient(180deg,rgba(6,12,28,.94),rgba(4,8,18,.94));overflow-y:auto;height:100vh;height:100dvh;overscroll-behavior:contain;-webkit-overflow-scrolling:touch}
.me{flex-shrink:0;margin-top:auto;margin-bottom:env(safe-area-inset-bottom,0)}.me b{word-break:break-word}
#sov{position:fixed;inset:0;background:rgba(2,6,14,.72);z-index:15;opacity:0;visibility:hidden;transition:.3s}body.mo #sov{opacity:1;visibility:visible}.mc{display:none}
@media(max-width:900px){.mc{display:grid}#side{z-index:20}}
.hero{display:grid;grid-template-columns:1.1fr 1fr 1.3fr;gap:18px;align-items:center}@media(max-width:900px){.hero{grid-template-columns:1fr}}
.sc2{text-align:left}.sc2.act{border-color:var(--crit)}.ico{font-size:2rem;color:var(--cy);text-shadow:0 0 16px var(--cy);line-height:1;margin-bottom:6px}
.sev{display:inline-block;font-size:.7rem;letter-spacing:.1em;text-transform:uppercase;padding:2px 10px;border:1px solid;border-radius:99px}.sev.warn{color:var(--warn)}.sev.crit{color:var(--crit)}
.sw{flex-wrap:wrap}.sw2{display:flex;align-items:center;gap:8px;background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.12);color:var(--txt);padding:7px 12px;border-radius:99px;width:auto!important;height:auto!important}
.sw2 i{width:16px;height:16px;border-radius:50%;background:var(--c);box-shadow:0 0 12px var(--c)}.sw2:hover{border-color:var(--c);box-shadow:0 0 16px color-mix(in srgb,var(--c) 40%,transparent)}.sw2.on{border-color:var(--c);background:color-mix(in srgb,var(--c) 18%,transparent)}

#tour{position:fixed;inset:0;z-index:80}
#tsp{position:fixed;border-radius:8px;box-shadow:0 0 0 9999px rgba(2,6,14,.8),0 0 0 2px var(--cy),0 0 30px var(--cy);transition:all .45s cubic-bezier(.2,.8,.2,1);pointer-events:none}
#tc{position:fixed;width:min(340px,calc(100vw - 24px));background:rgba(8,14,28,.97);border:1px solid var(--cy);border-radius:8px;padding:16px;box-shadow:0 0 40px color-mix(in srgb,var(--cy) 30%,transparent);animation:vin .4s both}
#tc.mid{left:50%;top:50%;transform:translate(-50%,-50%)}#tc h3{font:500 .95rem var(--hd);color:var(--cy);margin-bottom:6px}#tc p{font-size:.86rem;margin-bottom:12px}

.tb2{display:flex;gap:8px;align-items:center}
@media(max-width:900px){#tc,#tc.mid{left:12px;right:12px;bottom:12px;top:auto;width:auto;transform:none}}
#boot{animation:bootx .7s ease 3.5s forwards}@keyframes bootx{to{opacity:0;visibility:hidden}}.ib.hint{animation:hintp 1.6s ease-in-out infinite;border-color:var(--cy)}@keyframes hintp{50%{box-shadow:0 0 18px var(--cy)}}@media(max-width:900px){*,*::before,*::after{backdrop-filter:none!important;-webkit-backdrop-filter:none!important}#side{background:#070c18}#sov{background:rgba(2,6,14,.6)}}</style>
</head>
<body>
<div id="boot"><h1>AEGISMED ORBITAL</h1><small>Initializing crew telemetry link…</small><i></i></div>
<script>setTimeout(function(){var b=document.getElementById("boot");if(b)b.className="off"},4000)</script>
<canvas id="space" aria-hidden="true"></canvas>
<div class="app">
  <div id="sov" data-a="menu"></div>
  <nav id="side" aria-label="Main navigation"></nav>
  <main>
    <div class="top">
      <button class="ib" id="menu" data-a="menu" aria-label="Open menu">☰</button>
      <h1 id="title">Dashboard</h1>
      <span class="chip hide" id="clock">UTC</span>
      <button class="ib" data-a="tour" aria-label="Guided tour">?</button>
      <button class="ib" data-a="mic" aria-label="Voice commands">🎤</button>
      <button class="ib" data-a="bell" aria-label="Notifications">🔔<span class="badge" id="bd" hidden>0</span></button>
    </div>
    <div id="alert-banner" role="alert" hidden><strong></strong><span></span></div>
    <div id="view"></div>
  </main>
</div>
<div id="ov" data-a="close"></div>
<aside id="dr" aria-hidden="true" role="dialog" aria-modal="true" aria-labelledby="dt"><header><h2 id="dt" style="margin:0"></h2><button class="ib" data-a="close" aria-label="Close panel">✕</button></header><div class="bd" id="db"></div></aside>

<div id="fx"></div><div id="toast" role="status"></div><div id="prt"></div><div id="tour" hidden><div id="tsp"></div><div id="tc" role="dialog" aria-label="Guided tour"></div></div>
<div id="scn" hidden role="dialog" aria-modal="true" aria-label="Full body scan"></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js" defer></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js" defer onload="try{window.init3D&&init3D()}catch(e){document.getElementById('space').style.display='none'}"></script>
<script>
const $=(s,e=document)=>e.querySelector(s),$$=(s,e=document)=>[...e.querySelectorAll(s)];
const KEY='aegis-orbital-v2',day=d=>new Date(d).toISOString().slice(0,10),CLS=['ok','warn','crit'],NM=['Nominal','Warning','Critical'];
const DEF={crew:[{id:1,name:'Cdr. Amara Okafor',role:'Commander',age:41,blood:'O+',wt:72,note:'Mission lead'},{id:2,name:'Dr. Liang Wei',role:'Medical officer',age:38,blood:'A+',wt:68,note:''},{id:3,name:'Elena Petrova',role:'Flight engineer',age:35,blood:'B+',wt:61,note:''}],act:1,nid:4,start:Date.now()-112*864e5,rad:12.4,
 set:{acc:'#38bdf8',anim:1,fx:1,spd:1000,snd:0,tf:0},care:{},log:[],
 inv:[{n:'Analgesic tablets',q:120,m:40},{n:'IV fluid bags',q:14,m:6},{n:'Antiemetic doses',q:30,m:12},{n:'Antibiotic courses',q:8,m:4},{n:'Suture kits',q:6,m:3},{n:'Defibrillator pads',q:4,m:2}]};
let S=JSON.parse(JSON.stringify(DEF));try{const s=JSON.parse(localStorage.getItem(KEY));if(s)S={...S,...s,set:{...DEF.set,...s.set}}}catch(e){}
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}};
const addLog=(m,ty='info')=>{S.log.unshift({t:Date.now(),m,ty});S.log.length=Math.min(S.log.length,80);if(ty==='alert')unread++;save();badge()};
let unread=0,cur='dash',mode='nominal',tone=0x38bdf8,rate=22,lastWorst=0;
const hrH=Array(40).fill(70),radH=Array(40).fill(22);

/* vitals */
const V=[{n:'Heart rate',u:'bpm',ok:[50,90],w:[42,110],r:[35,135],dp:0,a:1.2},{n:'Systolic pressure',u:'mmHg',ok:[90,130],w:[85,142],r:[70,160],dp:0,a:1.2},{n:'Blood glucose',u:'mg/dL',ok:[70,110],w:[60,140],r:[45,170],dp:0,a:1.5},{n:'Core temperature',u:'°C',ok:[36.1,37.5],w:[35.5,38.2],r:[34.5,39.5],dp:1,a:.04},{n:'Sleep last cycle',u:'hours',ok:[6.5,9],w:[5,10],r:[2,10],dp:1,a:.03},{n:'Stress index',u:'/100',ok:[0,40],w:[0,70],r:[0,100],dp:0,a:1.4}];
const MODES={nominal:{t:[70,118,92,36.8,7.4,24]},
 flare:{t:[116,138,120,38.3,4.6,74],sev:2,title:'Solar radiation flare detected',d:'Radiation spike with crew heart rate and temperature rising.',steps:['Move the crew to the storm shelter module.','Log dosimeter readings every 10 minutes.','Hold non-essential EVA.','Notify the flight surgeon.']},
 stress:{t:[102,146,138,37.2,5.4,88],sev:2,title:'High cortisol stress spike',d:'Stress index, blood pressure and glucose climb together.',steps:['Pause the current task.','Do 5 minutes of paced breathing.','Open a private channel to the flight psychologist.','Re-check the stress index in 15 minutes.']},
 fluid:{t:[98,88,105,37.1,6.2,45],sev:1,title:'Fluid shift and low blood pressure',d:'Blood pressure drops while heart rate compensates.',steps:['Drink 500 ml of electrolyte solution.','Use the lower body negative pressure device for 30 minutes.','Re-check blood pressure after 20 minutes.']}};
V.forEach((v,i)=>v.c=MODES.nominal.t[i]);
const stat=v=>v.c>=v.ok[0]&&v.c<=v.ok[1]?0:v.c>=v.w[0]&&v.c<=v.w[1]?1:2;
const off=()=>{const k=S.act;return[(k*13)%9-4,(k*7)%11-5,(k*5)%13-6]};
const tc=v=>S.set.tf?(v*9/5+32):v;
const worst=()=>Math.max(...V.map(v=>v.s||0));
const radS=()=>rate<100?0:rate<250?1:2;

/* helpers */
const P=(t,b,c='')=>`<section class="panel ${c}"><h2>${t}</h2>${b}</section>`;
const crew=id=>S.crew.find(c=>c.id==id)||S.crew[0];
const av=c=>`<div class="av" style="background:hsl(${c.id*67%360} 60% 22%);color:hsl(${c.id*67%360} 90% 65%)">${c.name.replace(/^(Dr|Cdr|Col|Lt)\.\s*/,'').split(' ').map(w=>w[0]).slice(0,2).join('')}</div>`;
const vc=i=>`<article class="card ok" id="v${i}"><h3>${V[i].n}</h3><div class="val"><b>--</b><span>${i==3&&S.set.tf?'°F':V[i].u}</span><span id="t${i}" style="margin-left:auto;font-size:1.1rem;color:var(--cy)"></span></div><div class="bar"><i></i></div><svg class="sp" viewBox="0 0 100 20" preserveAspectRatio="none" aria-hidden="true"><polyline id="s${i}" points=""/></svg><p class="st">Nominal</p></article>`;
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const hm=t=>new Date(t).toISOString().slice(11,16);
function line(c,d,lo,hi,col){const dp=devicePixelRatio||1,w=c.clientWidth,h=c.clientHeight;if(!w)return;c.width=w*dp;c.height=h*dp;const x=c.getContext('2d');x.scale(dp,dp);
 x.strokeStyle='rgba(138,160,189,.18)';for(let i=0;i<4;i++){const y=8+i*(h-16)/3;x.beginPath();x.moveTo(0,y);x.lineTo(w,y);x.stroke()}
 const X=i=>i*w/(d.length-1),Y=v=>h-8-(Math.min(hi,Math.max(lo,v))-lo)/(hi-lo)*(h-16),g=x.createLinearGradient(0,0,0,h);g.addColorStop(0,col+'66');g.addColorStop(1,col+'00');
 const path=()=>{x.beginPath();d.forEach((v,i)=>i?x.lineTo(X(i),Y(v)):x.moveTo(X(i),Y(v)))};
 path();x.lineTo(w,h);x.lineTo(0,h);x.fillStyle=g;x.fill();path();x.strokeStyle=col;x.lineWidth=2.5;x.shadowColor=col;x.shadowBlur=8;x.stroke()}
function careOf(){const t=day(Date.now()),y=day(Date.now()-864e5);let c=S.care[S.act];if(!c)c=S.care[S.act]={day:t,done:[0,0,0],streak:0,last:''};if(c.day!==t){if(c.last!==y&&c.last!==t)c.streak=0;c.day=t;c.done=[0,0,0]}return c}
const score=()=>Math.max(5,100-V.filter(v=>v.s==1).length*7-V.filter(v=>v.s==2).length*18+careOf().done.filter(Boolean).length*2);

/* body map data */
const Z={neuro:['Neurological','Sleep disruption from 16 sunrises a day, headward fluid shift that can raise pressure inside the skull and blur vision, and heavy cognitive load.','Keep a fixed sleep schedule, use bright blue-enriched light in the morning, and report headaches or blurred vision to the flight surgeon.'],cardio:['Cardiovascular','Without gravity the heart does less work and can shrink slightly, blood pools toward the head, and standing after landing may cause fainting.','Do daily aerobic exercise, load fluids and salt before re-entry, and watch heart rate and rhythm trends.'],metab:['Metabolic','Insulin resistance, changed appetite, fluid and electrolyte shifts, and radiation exposure all strain metabolism.','Eat balanced meals on schedule, take electrolytes, and track blood glucose and core temperature.'],musculo:['Musculoskeletal','Bones can lose about 1% of their density each month and muscles weaken quickly when they carry no load.','Complete 2 hours a day of resistive and aerobic exercise (ARED, treadmill, cycle) and take vitamin D and calcium as prescribed.']};
const ZV={neuro:[4,5],cardio:[0,1],metab:[2,3],musculo:[]};

/* views */
const NAV=[['dash','▦','Dashboard'],['crew','♟','Crew'],['body','⌬','Body scan'],['sim','⚡','Simulator'],['care','✓','Countermeasures'],['rad','☢','Radiation'],['ecg','♥','Live ECG'],['eva','⌁','EVA planner'],['trend','▲','Health trends'],['live','◎','Live data'],['eco','✦','Space ecosystem'],['src','☍','Data sources'],['about','ⓘ','How it works'],['med','✚','Medical bay'],['log','≣','Mission log'],['set','⚙','Settings']];
const VW={
dash:()=>P('Autonomous early warning','<div id="ew"></div>','mb')+P('Mission status',`<div class="hero"><div><small>Mission elapsed time</small><div class="big" id="met" style="font-size:1.8rem">--</div><small>${esc(crew(S.act).name)} · ${esc(crew(S.act).role)}</small></div><div style="text-align:center"><svg viewBox="0 0 120 120" width="130" aria-hidden="true"><circle cx="60" cy="60" r="50" fill="none" stroke="rgba(255,255,255,.1)" stroke-width="8"/><circle id="wr" cx="60" cy="60" r="50" fill="none" stroke="var(--cy)" stroke-width="8" stroke-linecap="round" transform="rotate(-90 60 60)" stroke-dasharray="314" stroke-dashoffset="314" style="transition:stroke-dashoffset .8s;filter:drop-shadow(0 0 6px var(--cy))"/><text id="wsc" x="60" y="68" text-anchor="middle" fill="#e6f1ff" font-family="Orbitron" font-size="28">--</text></svg><br><small>Crew wellness score</small></div><div id="orb"></div></div>`,'mb')+`<div class="vitals">${V.map((_,i)=>vc(i)).join('')}</div><div class="two">${P('Live heart rate',`<canvas id="hr" class="ch"></canvas>`)}${P('Crew roster',S.crew.map(c=>`<button class="row" data-a="act" data-i="${c.id}">${av(c)}<span><b>${esc(c.name)}</b><small>${esc(c.role)}</small></span><em>${c.id==S.act?'Active':'Switch'}</em></button>`).join(''))}</div>`,
crew:()=>`<div class="tb"><span class="mut">${S.crew.length} crew members · mission day ${Math.floor((Date.now()-S.start)/864e5)+1}</span><button class="btn p" data-a="cadd">+ Add crew member</button></div><div class="three">${S.crew.map(c=>P(esc(c.name),`<div style="display:flex;gap:12px;align-items:center;margin-bottom:10px">${av(c)}<div><b>${esc(c.role)}</b><br><small>Age ${c.age} · ${c.blood} · ${c.wt} kg</small></div></div><p class="mut" style="min-height:20px">${esc(c.note)||'No notes.'}</p><div style="display:flex;gap:8px;margin-top:12px;flex-wrap:wrap"><button class="btn" data-a="act" data-i="${c.id}">${c.id==S.act?'Active ✓':'Set active'}</button><button class="btn" data-a="cedit" data-i="${c.id}">Edit</button><button class="btn d" data-a="cdel" data-i="${c.id}">Remove</button></div>`)).join('')}</div>`,
body:()=>`<div class="two">${P('Interactive body scan',`<svg id="body" viewBox="0 0 200 420" role="group" aria-label="Body map"><g class="zone" data-a="zone" data-z="neuro" tabindex="0" role="button" aria-label="Neurological"><circle class="s" cx="100" cy="48" r="30"/></g><g class="zone" data-a="zone" data-z="cardio" tabindex="0" role="button" aria-label="Cardiovascular"><rect class="s" x="62" y="86" width="76" height="100" rx="24"/></g><g class="zone" data-a="zone" data-z="metab" tabindex="0" role="button" aria-label="Metabolic"><rect class="s" x="68" y="192" width="64" height="80" rx="18"/></g><g class="zone" data-a="zone" data-z="musculo" tabindex="0" role="button" aria-label="Musculoskeletal"><rect class="s" x="26" y="92" width="26" height="172" rx="13"/><rect class="s" x="148" y="92" width="26" height="172" rx="13"/><rect class="s" x="70" y="278" width="28" height="132" rx="14"/><rect class="s" x="102" y="278" width="28" height="132" rx="14"/></g><rect class="scan" x="20" y="0" width="160" height="2" pointer-events="none"/></svg><button class="btn p" data-a="bscan" style="margin-top:10px;width:100%">Run full body scan</button>`)}<section class="panel" id="brief" aria-live="polite"><h2>Select a zone</h2><p class="mut">Tap a body zone to see its spaceflight hazards and guidance for ${esc(crew(S.act).name)}.</p></section></div>`,
sim:()=>`<div class="three mb">${Object.entries(MODES).filter(([k])=>k!='nominal').map(([k,m])=>`<section class="panel sc2 ${mode==k?'act':''}"><div class="ico">${{flare:'☀',stress:'◍',fluid:'≈'}[k]}</div><h2>${m.title}</h2><p class="mut" style="margin-bottom:12px">${m.d}</p><span class="sev ${CLS[m.sev]}">${m.sev==2?'Critical':'Warning'}</span><button class="btn ${m.sev==2?'d':''}" data-a="mode" data-m="${k}" style="margin-top:12px;width:100%">${mode==k?'Active now':'Trigger scenario'}</button></section>`).join('')}</div>${P('Live crew response',`<div class="vitals" style="margin:0">${V.map((_,i)=>vc(i)).join('')}</div>`,'mb')}${P('Autonomous early warning','<div id="ew"></div>','mb')}<div class="tb"><span class="mut">Active: <b>${mode=='nominal'?'Nominal':MODES[mode].title}</b></span><button class="btn p" data-a="mode" data-m="nominal">Return to nominal</button></div>`,
care:()=>{const c=careOf(),n=c.done.filter(Boolean).length;c.ex=c.ex||0;c.w=c.w||0;return`<div class="two">${P('Daily countermeasures',`<div style="display:flex;align-items:center;gap:18px;flex-wrap:wrap;margin-bottom:8px"><svg viewBox="0 0 120 120" width="120" aria-hidden="true"><circle cx="60" cy="60" r="50" fill="none" stroke="rgba(255,255,255,.1)" stroke-width="10"/><circle id="rg" cx="60" cy="60" r="50" fill="none" stroke="var(--cy)" stroke-width="10" stroke-linecap="round" transform="rotate(-90 60 60)" stroke-dasharray="314" stroke-dashoffset="${314-314*n/3}" style="transition:stroke-dashoffset .8s;filter:drop-shadow(0 0 6px var(--cy))"/><text id="rgt" x="60" y="67" text-anchor="middle" fill="#e6f1ff" font-family="Orbitron" font-size="24">${n}/3</text></svg><div><span class="big" id="stk">${c.streak}</span> day streak<br><small>Complete all three to extend it.</small></div></div>`+['2 hours resistive and aerobic exercise (ARED)','Electrolyte hydration (2 litres)','Circadian light alignment'].map((t,i)=>`<label class="chk"><input type="checkbox" data-c="${i}" ${c.done[i]?'checked':''}>${t}</label>`).join('')+`<small style="display:block;margin-top:8px">Light plan: blue-enriched light until noon, dim warm light after 20:00.</small>`)}${P('Exercise and hydration',`<p class="mut">ARED exercise timer (time-lapse: 1 second = 1 minute)</p><div class="big" id="exm" style="font-size:1.5rem;margin:6px 0">0 / 120 min</div><div class="prog"><i id="exb"></i></div><div style="display:flex;gap:8px;margin:12px 0 18px"><button class="btn p" id="exbtn" data-a="ext">Start</button></div><p class="mut">Hydration</p><div class="big" id="wtm" style="font-size:1.5rem;margin:6px 0">0 / 2000 ml</div><div class="prog"><i id="wtb"></i></div><div style="display:flex;gap:8px;margin-top:12px"><button class="btn" data-a="wat" data-d="250">+ 250 ml</button><button class="btn" data-a="wat" data-d="-250">− 250 ml</button></div>`)}</div>${P('Wellness score, 7 days',`<canvas id="wl" class="ch"></canvas>`)}`},
rad:()=>`${P('Radiation environment',`<canvas id="rp" class="ch" style="height:210px"></canvas><small>Particle density and speed follow the live dose rate. The ring is the shield around the crew module.</small>`,'mb')}<div class="two">${P('Dose rate',`<div class="big" id="rt">--</div><small>µSv per hour · <span id="rs"></span></small><canvas id="rc" class="ch" style="margin-top:10px"></canvas>`)}${P('Mission dose',`<div class="big" id="cm">--</div><small>mSv accumulated (time-lapse demo) of the 600 mSv career limit</small><div class="prog" style="margin:14px 0"><i id="cp"></i></div><p class="mut">A solar flare raises the dose rate sharply. Shelter in the storm module when it turns red.</p>`)}</div>`,
med:()=>`<div class="tb"><span class="mut">Medical bay for ${esc(crew(S.act).name)}</span><div style="display:flex;gap:8px;flex-wrap:wrap"><button class="btn p" data-a="bscan">Full body scan</button><button class="btn" data-a="scan">Crew health scan</button><button class="btn" data-a="tele">Call flight surgeon</button><button class="btn" data-a="prt">Print report</button></div></div>${P('Medical supplies',S.inv.map((it,i)=>`<div class="row" style="cursor:default"><span><b>${it.n}</b><small>${it.q<=it.m?'<span style="color:var(--crit)">Low stock · reorder</span>':'In stock'} · minimum ${it.m}</small></span><button class="btn" data-a="inv" data-i="${i}" data-d="-1" aria-label="Use one ${it.n}">−</button><b style="min-width:34px;text-align:center">${it.q}</b><button class="btn" data-a="inv" data-i="${i}" data-d="1" aria-label="Add one ${it.n}">+</button></div>`).join(''))}`,
log:()=>`${P('Add a log entry',`<form id="nf" style="display:flex;gap:10px"><input name="m" placeholder="Write a mission note" required maxlength="140"><button class="btn p">Add note</button></form>`)}<div style="margin-top:14px"></div>${P('Mission log',S.log.length?S.log.map(l=>`<div class="log ${l.ty}"><time>${hm(l.t)}Z</time><span>${esc(l.m)}</span></div>`).join(''):'<p class="mut">No entries yet. Notes and system events appear here.</p>')}`,
live:()=>`<div class="two">${P('ISS live position',`<div id="im" style="height:270px;border-radius:12px;overflow:hidden"></div><p class="mut" id="iss" style="margin-top:8px">Loading the ISS position…</p>`)}${P('Solar flares, last 30 days (NASA DONKI)',`<div id="fl"></div><button class="btn" data-a="rfl" style="margin-top:10px">Refresh</button><p class="mut" id="fs" style="margin-top:8px"></p>`)}</div>${P('Space weather now (NOAA SWPC)',`<div id="sw">Loading NOAA data…</div>`,'mb')}${P('Live heart-rate sensor',`<p class="mut" id="ss" style="margin-bottom:12px"></p><div style="display:flex;gap:10px;flex-wrap:wrap;align-items:center"><button class="btn p" data-a="ble">Connect Bluetooth sensor</button><form id="mf" style="display:flex;gap:8px"><input name="hr" type="number" min="30" max="200" placeholder="Type bpm" required style="width:120px"><button class="btn">Send reading</button></form></div><p class="mut" style="margin-top:10px">Works with Bluetooth heart-rate straps and watches in Chrome or Edge. The reading replaces the simulated heart rate.</p>`)}`,
ecg:()=>`<div class="two">${P('Live ECG',`<canvas id="ec" class="ch" style="height:220px"></canvas><p class="mut" id="eb" style="margin-top:8px"></p>`)}${P('Heart',`<div style="display:grid;place-items:center;height:220px"><svg viewBox="0 0 100 90" width="150" aria-hidden="true"><path id="hp" d="M50 84C10 56 0 36 0 22 0 9 10 0 24 0c10 0 19 6 26 15C57 6 66 0 76 0c14 0 24 9 24 22 0 14-10 34-50 62z" fill="var(--crit)" style="filter:drop-shadow(0 0 14px var(--crit));transform-origin:50% 50%"/></svg></div>`)}</div><p class="mut">The trace is a model driven by the live heart rate. It changes shape when the heart rate is critical.</p>`,
eva:()=>`${P('Spacewalk (EVA) readiness',`<div id="evb"></div>`,'mb')}${P('Next 8 hours',[['In 1 h','Exercise block (ARED)'],['In 2 h','Medical conference with the flight surgeon'],['In 4 h','Spacewalk window opens if all checks are GO'],['In 8 h','Sleep period']].map(r=>`<div class="sr"><b>${r[0]}</b><small>${r[1]}</small></div>`).join(''))}`,
trend:()=>`<div class="two">${P('Bone density projection',`<label class="f">Exercise adherence: <b id="adv">70%</b><input id="ad" type="range" min="0" max="100" value="70"></label><canvas id="bn" class="ch"></canvas><small>Illustrative model over 12 months, based on a loss of roughly 1–1.5% per month without exercise.</small>`)}${P('Sleep and circadian rhythm',`<canvas id="sl2" class="ch"></canvas><small>Hours of sleep, last 7 cycles. The ISS sees about 16 sunrises a day, which disturbs sleep.</small>`)}</div>`,
eco:()=>`<div class="three mb">${[['0304','AIA 304 Å','Chromosphere and flares'],['0193','AIA 193 Å','Corona and coronal holes'],['HMIIC','HMI','Sunspots in visible light']].map(a=>P('Sun now · '+a[1],`<img class="sun" alt="Live Sun image: ${a[2]}" src="https://sdo.gsfc.nasa.gov/assets/img/latest/latest_512_${a[0]}.jpg" onerror="this.alt='Image unavailable. Check your connection.'"><small>${a[2]} · NASA SDO</small>`)).join('')}</div><div class="two">${P('Aurora forecast (north)',`<img class="eimg" alt="NOAA aurora forecast" src="https://services.swpc.noaa.gov/images/animations/ovation/north/latest.jpg" onerror="this.alt='Image unavailable. Check your connection.'"><small>NOAA Ovation model. A strong aurora means high geomagnetic activity.</small>`)}${P('Earth now',`<div id="ep">Loading…</div>`)}</div><div class="two">${P('Asteroids passing this week',`<div id="ne">Loading…</div>`)}${P('NASA picture of the day',`<div id="ap">Loading…</div>`)}</div>${P('Open natural events on Earth (also orange dots on the ISS map)',`<div id="ev">Loading…</div>`)}`,
about:()=>`${P('The problem',`<p>On long missions to the Moon and Mars, crews are far from hospitals and cannot wait for help from Earth. Microgravity, radiation and stress change the body in ways that need constant watching.</p>`,'mb')}${P('Our solution',`<p>AegisMed Orbital is a crew health command dashboard. It watches vital signs, warns before they leave their safe range, tracks space weather and the ISS, and tells the crew what to do next.</p>`,'mb')}${P('How it works',`<div class="sr"><b>1. Sense</b><small>Vitals come from a simulator or a real Bluetooth heart-rate sensor. Space weather and the ISS position come from NASA and NOAA feeds.</small></div><div class="sr"><b>2. Predict</b><small>A trend check on every vital estimates when it will leave its safe range and raises an early warning.</small></div><div class="sr"><b>3. Act</b><small>Emergency protocols, daily countermeasures, a full body scan and a flight surgeon link guide the response.</small></div><div class="sr"><b>4. Share</b><small>The same app runs on a mission control laptop and on an astronaut tablet.</small></div>`,'mb')}${P('Next steps',`<p>Connect wearables for the whole crew, run edge models on board, and validate the thresholds with flight surgeons. Open <b>Data sources</b> for what is real and what is simulated.</p>`)}`,
src:()=>`${P('Data sources and credits',SRCS.map(x=>`<div class="row src" style="cursor:default;align-items:flex-start"><span><b>${x[0]}</b><small>${x[1]}</small><a href="${x[2]}" target="_blank" rel="noopener">${x[2]}</a></span></div>`).join('')+`<p class="mut" style="margin-top:14px">We acknowledge the Community Coordinated Modeling Center (CCMC) at Goddard Space Flight Center for the use of DONKI.</p>`,'mb')}${P('What is real and what is simulated',`<p><b>Real:</b> live Sun, aurora and Earth images, asteroids, natural events, ISS position, solar flares, X-ray flux, proton flux, Kp index, and the heart rate from a connected sensor.</p><p style="margin-top:8px"><b>Simulated:</b> crew vitals, crew records, supplies, and the accumulated radiation dose.</p>`)}`,
set:()=>`<div class="two">${P('Appearance',`<small>Accent color</small><div class="sw" style="margin:8px 0 14px">${[['#38bdf8','Orbit'],['#a78bfa','Nebula'],['#34d399','Terminal'],['#fb923c','Mars'],['#f472b6','Pulsar'],['#e2e8f0','Lunar']].map(c=>`<button data-a="acc" data-c="${c[0]}" class="sw2 ${S.set.acc==c[0]?'on':''}" style="--c:${c[0]}"><i></i>${c[1]}</button>`).join('')}</div><label class="tg">Animations<input type="checkbox" data-s="anim" ${S.set.anim?'checked':''}></label><label class="tg">3D Earth background<input type="checkbox" data-s="fx" ${S.set.fx?'checked':''}></label><label class="tg">3D quality<select data-s="q" style="width:auto"><option value="0" ${QL()==0?'selected':''}>Low</option><option value="1" ${QL()==1?'selected':''}>Medium</option><option value="2" ${QL()==2?'selected':''}>High</option></select></label><label class="tg">Larger text<input type="checkbox" data-s="big" ${S.set.big?'checked':''}></label>`)}${P('Telemetry',`<label class="tg">Alarm sound<input type="checkbox" data-s="snd" ${S.set.snd?'checked':''}></label><label class="tg">Temperature in °F<input type="checkbox" data-s="tf" ${S.set.tf?'checked':''}></label><label class="f" style="margin-top:12px">NASA API key (free at api.nasa.gov)<input data-s="key" value="${esc(S.set.key||'')}" placeholder="DEMO_KEY"></label><label class="f">Update speed<select data-s="spd"><option value="2000" ${S.set.spd==2000?'selected':''}>Slow (2 s)</option><option value="1000" ${S.set.spd==1000?'selected':''}>Normal (1 s)</option><option value="500" ${S.set.spd==500?'selected':''}>Fast (0.5 s)</option></select></label>`)}</div>${P('Data',`<div style="display:flex;gap:10px;flex-wrap:wrap"><button class="btn" data-a="tour">Replay guided tour</button><button class="btn" data-a="wall">Mission control wall mode</button><button class="btn" data-a="exp">Export data (JSON)</button><button class="btn d" data-a="reset">Reset everything</button></div>`)}`
};

}
let n=0;
function tick(){const t=MODES[mode].t,o=off();
  V.forEach((v,i)=>{const g=t[i]+(i<3?o[i]:0);v.c+=(g-v.c)*.12+(Math.random()-.5)*2*v.a;v.c=Math.max(v.r[0],Math.min(v.r[1],v.c))});
  if(live.until>Date.now())V[0].c=Math.max(35,Math.min(135,live.hr));trendCalc();rate+=((mode=='flare'?(MODES.flare.sev==2?380:90):22)-rate)*.1+(Math.random()-.5)*2;rate=Math.max(5,rate);S.rad+=rate/3.6e6*600;
  hrH.push(V[0].c);hrH.shift();radH.push(rate);radH.shift();paint();if(++n%15==0)save()}

zone:d=>{$$('.zone').forEach(z=>z.classList.toggle('sel',z.dataset.z==d.z));const z=Z[d.z],vs=ZV[d.z].map(i=>V[i]),h=`<p><b>Spaceflight hazard</b><br>${z[1]}</p><p style="margin-top:10px"><b>Guidance</b><br>${z[2]}</p>`;
 const br=$('#brief');if(br)br.innerHTML=`<h2>${z[0]}</h2>${h}`;drawer(z[0],(vs.length?vs.map(v=>`<div class="sr"><b>${v.n}</b><small>${v.c.toFixed(v.dp)} ${v.u}</small><em style="color:var(--${CLS[v.s||0]})">${NM[v.s||0]}</em></div>`).join(''):`<div class="sr"><b>Exercise</b><small>${careOf().done[0]?'ARED done today':'ARED pending today'}</small></div>`)+`<div style="margin-top:14px">${h}</div><button class="btn p" style="margin-top:16px" data-a="bscan">Run full body scan</button>`)},
mode:d=>{mode=d.m;if(mode=='flare')flash();const m=MODES[mode];addLog(mode=='nominal'?'Scenario cleared, telemetry nominal':'Scenario started: '+m.title,mode=='nominal'?'info':'alert');

  tick();if(cur=='sim')go('sim')},

inv:d=>{const it=S.inv[d.i];it.q=Math.max(0,it.q+ +d.d);if(it.q<=it.m)addLog(`Low stock: ${it.n}`,'alert');save();go('med')},
scan:()=>{drawer('Crew health scan',S.crew.map((c,i)=>{const s=c.id==S.act?worst():0;return`<div><b>${esc(c.name)}</b><div class="sbar"><i data-w="100" style="transition-delay:${i*.7}s"></i></div><small style="color:var(--${CLS[s]})">${NM[s]}${c.id==S.act?' · live telemetry':' · last check within limits'}</small></div><br>`}).join(''));addLog('Crew health scan completed');setTimeout(()=>$$('.sbar i').forEach(i=>i.style.width='100%'),80)},

};

 drawer(c?'Edit crew member':'Add crew member',`<form id="cf"><input type="hidden" name="id" value="${e.id}"><label class="f">Full name<input name="name" value="${esc(e.name)}" required maxlength="40"></label><label class="f">Role<select name="role">${o(['Commander','Pilot','Flight engineer','Mission specialist','Medical officer','Payload specialist'],e.role)}</select></label><label class="f">Age<input type="number" name="age" min="18" max="75" value="${e.age}" required></label><label class="f">Blood type<select name="blood">${o(['O+','O-','A+','A-','B+','B-','AB+','AB-'],e.blood)}</select></label><label class="f">Weight (kg)<input type="number" name="wt" min="35" max="160" value="${e.wt}" required></label><label class="f">Medical notes<textarea name="note" rows="3" maxlength="200">${esc(e.note)}</textarea></label><button class="btn p">Save crew member</button></form>`)}

document.addEventListener('keydown',e=>{if(e.key==='Escape'){closeD();A.scx();menu(0);if(!$('#tour').hidden)tourEnd()}const z=e.target.closest&&e.target.closest('.zone');if(z&&(e.key==='Enter'||e.key===' ')){e.preventDefault();A.zone(z.dataset)}});
document.addEventListener('change',e=>{const t=e.target;
 if(t.dataset.c!==undefined){const c=careOf(),all0=c.done.every(Boolean);c.done[t.dataset.c]=t.checked?1:0;const all=c.done.every(Boolean),y=day(Date.now()-864e5),td=day(Date.now());
  if(all&&c.last!==td){c.streak++;c.last=td;addLog(`${crew(S.act).name} completed all countermeasures`)}else if(!all&&c.last===td){c.streak=Math.max(0,c.streak-1);c.last=c.streak?y:''}
  save();$('#stk').textContent=c.streak;ringUI();wl()}
 if(t.dataset.s){const k=t.dataset.s;S.set[k]=t.type=='checkbox'?+t.checked:t.value;save();if(k=='spd')run();if(k=='q'&&window.setQ)setQ();theme()}});
document.addEventListener('submit',e=>{e.preventDefault();const f=e.target,d=Object.fromEntries(new FormData(f));
 if(f.id=='cf'){const o={name:d.name.trim(),role:d.role,age:+d.age,blood:d.blood,wt:+d.wt,note:d.note};if(+d.id){Object.assign(crew(d.id),o);addLog(`Updated crew member: ${o.name}`)}else{S.crew.push({id:S.nid++,...o});addLog(`Added crew member: ${o.name}`)}save();closeD();go(cur)}
 if(f.id=='mf'){live.hr=Math.max(30,Math.min(200,+d.hr));live.until=Date.now()+30000;live.src='Manual reading';ssUI()}
 if(f.id=='nf'){addLog(d.m.trim(),'note');go('log')}
 if(f.id=='tf'){const c=$('#chat');c.insertAdjacentHTML('beforeend',`<div class="msg me2">${esc(d.m)}</div>`);f.reset();c.insertAdjacentHTML('beforeend','<div class="msg dr2" id="ty">…</div>');
  setTimeout(()=>{const m=MODES[mode],r=mode=='nominal'?'Telemetry looks nominal. Keep to your exercise and hydration schedule, and message me if the symptom lasts more than 24 hours.':`I see the ${m.title.toLowerCase()} on the monitors. ${m.steps[0]} Then ${m.steps[1].charAt(0).toLowerCase()+m.steps[1].slice(1)}`;$('#ty').outerHTML=`<div class="msg dr2">${r}</div>`;c.scrollTop=c.scrollHeight},1100)}});
function theme(){document.body.classList.toggle('big',!!S.set.big);document.documentElement.style.setProperty('--cy',S.set.acc);document.body.classList.toggle('noanim',!S.set.anim);$('#space').style.display=S.set.fx?'block':'none'}

/* Live data, early warning, sensors */
let issA=null,EW=[];const LV={iss:null,fl:null,ft:0,err:{},trail:[]},live={hr:0,until:0,src:''};
const HINT=['Reduce exertion and check for stress or radiation exposure.','Check hydration and fluid status.','Check the last meal and insulin response.','Check for infection signs or radiation exposure.','Adjust the light schedule and rest time.','Offer a short breathing break.'];
function trendCalc(){V.forEach(v=>{v.h=v.h||[];v.h.push(v.c);if(v.h.length>20)v.h.shift()});EW=[];
 V.forEach((v,i)=>{const h=v.h,n=h.length;if(n<12){v.tr=0;return}let sx=0,sy=0,sxy=0,sxx=0;h.forEach((y,x)=>{sx+=x;sy+=y;sxy+=x*y;sxx+=x*x});
  const sl=(n*sxy-sx*sy)/(n*sxx-sx*sx);v.tr=Math.abs(sl)*n>(v.ok[1]-v.ok[0])*.06?Math.sign(sl):0;
  if(stat(v)==0&&v.tr){const eta=((v.tr>0?v.ok[1]:v.ok[0])-v.c)/sl;if(eta>0&&eta<45)EW.push({i,eta:Math.max(1,Math.round(eta*S.set.spd/1000)),up:v.tr>0})}});
 V.forEach((v,i)=>{if(EW.some(e=>e.i==i)){if(!v.ew){v.ew=1;addLog(`Early warning: ${v.n} is ${v.tr>0?'rising':'falling'} toward the limit`,'alert')}}else v.ew=0})}
function ewUI(){$('#ew').innerHTML=EW.length?EW.map(e=>`<div class="sr"><b style="color:var(--warn)">${V[e.i].n}</b><small>${e.up?'Rising':'Falling'}: predicted to leave the safe range in about ${e.eta} s. ${HINT[e.i]}</small></div>`).join(''):'<p class="mut"><span style="color:var(--ok)">●</span> No risk predicted. Trends are stable across all six vitals.</p>'}
function ssUI(){$('#ss').textContent=live.until>Date.now()?`Live sensor: ${live.hr} bpm (${live.src}). This value drives the heart-rate vital.`:'No sensor connected. Heart rate is simulated.'}
async function getISS(){try{const j=await(await fetch('https://api.wheretheiss.at/v1/satellites/25544')).json();if(typeof j.latitude!='number')throw 0;LV.iss=j;LV.trail.push([j.longitude,j.latitude]);if(LV.trail.length>60)LV.trail.shift();issA=j.longitude*Math.PI/180;LV.err.iss=0}catch(e){LV.err.iss=1}if(cur=='live')liveUI()}
const SW={},SRCS=[['NASA CCMC DONKI (solar flares)','Real solar flare events in the Live data tab and the Replay as scenario button.','https://ccmc.gsfc.nasa.gov/tools/DONKI'],['NOAA SWPC real-time JSON data (X-ray flux, proton flux, Kp index)','Space weather now panel and the backup flare list.','https://services.swpc.noaa.gov/json/goes/'],['NOAA space weather scales','Definitions of flare classes, radiation storms (S-scale) and geomagnetic storms (Kp).','https://www.swpc.noaa.gov/noaa-scales-explanation'],['Where the ISS at? API','Live ISS latitude, longitude, altitude and speed.','https://wheretheiss.at/w/developer'],['NASA Solar Dynamics Observatory (live Sun images)','Sun now panels.','https://sdo.gsfc.nasa.gov/'],['NOAA Ovation aurora forecast','Aurora forecast image.','https://www.swpc.noaa.gov/products/aurora-30-minute-forecast'],['NASA EPIC (Earth images)','Earth now panel.','https://epic.gsfc.nasa.gov/'],['NASA Open APIs: NeoWs asteroids and APOD','Asteroids this week and the picture of the day.','https://api.nasa.gov/'],['NASA EONET natural events','Open natural events list and orange map markers.','https://eonet.gsfc.nasa.gov/'],['Leaflet','Interactive map library.','https://leafletjs.com'],['CARTO basemaps with OpenStreetMap data','Dark map tiles. © OpenStreetMap contributors © CARTO.','https://carto.com/basemaps'],['Three.js','3D Earth and space scene.','https://threejs.org'],['NASA Human Research Program','Background for the hazard briefings: bone, heart, brain and radiation risks of spaceflight.','https://www.nasa.gov/hrp/'],['NASA Open Science Data Repository','Spaceflight biology and health datasets for future work.','https://osdr.nasa.gov/']];
const srt=(x,y)=>(y.beginTime||'').localeCompare(x.beginTime||'');
async function getFlares(){const q=`?startDate=${day(Date.now()-30*864e5)}&endDate=${day(Date.now())}`;LV.err.fl=1;
 for(const u of['https://ccmc.gsfc.nasa.gov/DONKI/WS/get/FLR'+q,'https://ccmc.gsfc.nasa.gov/DONKI-API/get/FLR'+q,'https://api.nasa.gov/DONKI/FLR'+q+'&api_key='+(S.set.key||'DEMO_KEY')]){
  try{const r=await fetch(u);if(!r.ok)continue;const t=await r.text(),x=t?JSON.parse(t):[];if(!Array.isArray(x))continue;LV.fl=x.filter(f=>f.classType).sort(srt);LV.src='NASA CCMC DONKI (last 30 days)';LV.err.fl=0;LV.ft=Date.now();break}catch(e){}}
 if(LV.err.fl){try{const x=await(await fetch('https://services.swpc.noaa.gov/json/goes/primary/xray-flares-7-day.json')).json();LV.fl=x.filter(f=>f.max_class).map(f=>({classType:f.max_class,beginTime:f.begin_time||f.time_tag})).sort(srt);LV.src='NOAA SWPC GOES X-ray flares, last 7 days (DONKI did not respond)';LV.err.fl=0;LV.ft=Date.now()}catch(e){}}
 if(cur=='live')liveUI()}
const fcls=f=>f>=1e-4?'X'+(f/1e-4).toFixed(1):f>=1e-5?'M'+(f/1e-5).toFixed(1):f>=1e-6?'C'+(f/1e-6).toFixed(1):f>=1e-7?'B'+(f/1e-7).toFixed(1):'A'+(f/1e-8).toFixed(1);

let scanId=0,scanRep='';
const SIL='<svg viewBox="0 0 200 420" aria-hidden="true"><circle class="so" data-z="neuro" cx="100" cy="48" r="30"/><rect class="so" data-z="cardio" x="62" y="86" width="76" height="100" rx="24"/><rect class="so" data-z="metab" x="68" y="192" width="64" height="80" rx="18"/><rect class="so" data-z="musculo" x="26" y="92" width="26" height="172" rx="13"/><rect class="so" data-z="musculo" x="148" y="92" width="26" height="172" rx="13"/><rect class="so" data-z="musculo" x="70" y="278" width="28" height="132" rx="14"/><rect class="so" data-z="musculo" x="102" y="278" width="28" height="132" rx="14"/><rect class="lz" x="10" y="0" width="180" height="3"/></svg>';
function bodyScan(){closeD();menu(0);const id=++scanId,c=crew(S.act),o=$('#scn'),cd=careOf(),f=i=>V[i].c.toFixed(V[i].dp);
 o.hidden=false;o.innerHTML=`<div class="sx"><button class="ib" data-a="scx" aria-label="Close scan">✕</button><h2>Full body scan · ${esc(c.name)}</h2><div class="sg"><div class="sb">${SIL}</div><div id="sl"></div></div><div class="prog"><i id="sp" style="width:0"></i></div><p class="mut" id="sm" style="margin-top:8px">Initializing sensors…</p><div id="rs2"></div></div>`;
 const SY=[['neuro','Neurological',`Sleep ${f(4)} h · stress ${f(5)}`,Math.max(V[4].s,V[5].s)],['cardio','Cardiovascular',`${f(0)} bpm · ${f(1)} mmHg`,Math.max(V[0].s,V[1].s)],['metab','Metabolic',`${f(2)} mg/dL · ${tc(V[3].c).toFixed(1)} °${S.set.tf?'F':'C'}`,Math.max(V[2].s,V[3].s)],['musculo','Musculoskeletal',`Exercise ${cd.done[0]?'done':'pending'} today`,cd.done[0]?0:1],['rad','Radiation',`${rate.toFixed(0)} µSv/h`,radS()]];
 const N=SY.length,T=1300;
 SY.forEach((y,i)=>{
  setTimeout(()=>{if(id!=scanId)return;$$('.so').forEach(e=>e.classList.toggle('hot',y[0]=='rad'||e.dataset.z==y[0]));$('#sm').textContent=`Analyzing ${y[1].toLowerCase()}…`;$('#sl').insertAdjacentHTML('beforeend',`<div class="sr" id="r${i}"><b>${y[1]}</b><small>Reading…</small></div>`);$('#sp').style.width=(i/N*100+8)+'%'},i*T);
  setTimeout(()=>{if(id!=scanId)return;$('#r'+i).innerHTML=`<b>${y[1]}</b><small>${y[2]}</small><em style="color:var(--${CLS[y[3]]})">${NM[y[3]]}</em>`;$('#sp').style.width=(i+1)/N*100+'%'},i*T+1000)});
 setTimeout(()=>{if(id!=scanId)return;const ov=Math.max(...SY.map(y=>y[3])),adv=mode!='nominal'?MODES[mode].steps[0]:'Re-check in 15 minutes and contact the flight surgeon if readings stay out of range.';
  $$('.so').forEach(e=>e.classList.remove('hot'));const lz=$('.lz');lz&&lz.remove();$('#sm').textContent='Scan complete';
  scanRep=`AEGISMED ORBITAL SCAN REPORT\nCrew member: ${c.name} (${c.role})\nTime: ${new Date().toISOString()}\n\n`+SY.map(y=>`${y[1]}: ${y[2]} - ${NM[y[3]]}`).join('\n')+`\n\nOverall: ${NM[ov]}\nAdvice: ${ov?adv:'No action needed.'}\nSimulated data for demonstration only.\n`;
  $('#rs2').innerHTML=`<section class="panel" style="margin-top:14px"><h2 style="color:var(--${CLS[ov]})">Overall: ${NM[ov]}</h2><p class="mut">${ov?adv:'No action needed. Keep up the exercise and hydration schedule.'}</p><div style="display:flex;gap:8px;flex-wrap:wrap;margin-top:12px"><button class="btn p" data-a="rpt">Save report</button><button class="btn" data-a="scx" data-t="1">Call flight surgeon</button><button class="btn" data-a="scx">Close</button></div></section>`;
  addLog(`Full body scan: ${c.name} · ${NM[ov]}`,ov?'alert':'info')},N*T+200)}

/* 3D deep-space scene */
window.init3D=function(){if(!window.THREE)return;const T=THREE;
 const R=new T.WebGLRenderer({canvas:$('#space'),antialias:true,alpha:true});R.setPixelRatio(Math.min(devicePixelRatio,2));
 const sc=new T.Scene(),cam=new T.PerspectiveCamera(45,1,.1,1000);cam.position.z=10;const G=new T.Group(),E=new T.Group();sc.add(G);G.add(E);
 const wm=(c,o)=>new T.MeshBasicMaterial({color:c,wireframe:true,transparent:true,opacity:o}),BG=(a,n)=>{const g=new T.BufferGeometry();g.setAttribute('position',new T.Float32BufferAttribute(a,3));return g};
 E.add(new T.Mesh(new T.SphereGeometry(2.4,48,48),new T.MeshBasicMaterial({color:0x040d1f})));
 const wire=new T.Mesh(new T.SphereGeometry(2.42,36,24),wm(0x38bdf8,.22));E.add(wire);
 const shell=new T.Mesh(new T.IcosahedronGeometry(3,2),wm(0xa78bfa,.1));G.add(shell);
 const p=[];for(let i=0;i<1400;i++){const u=Math.random()*2-1,a=Math.random()*6.283,r=Math.sqrt(1-u*u)*2.45;p.push(r*Math.cos(a),u*2.45,r*Math.sin(a))}
 const lt=new T.Points(BG(p),new T.PointsMaterial({color:0x7dd3fc,size:.04,transparent:true,opacity:.85,blending:T.AdditiveBlending}));E.add(lt);
 G.add(new T.Mesh(new T.SphereGeometry(2.85,48,48),new T.ShaderMaterial({vertexShader:'varying vec3 n;void main(){n=normalize(normalMatrix*normal);gl_Position=projectionMatrix*modelViewMatrix*vec4(position,1.);}',fragmentShader:'varying vec3 n;void main(){float i=pow(.72-dot(n,vec3(0.,0.,1.)),4.);gl_FragColor=vec4(.22,.74,.97,1.)*i*1.3;}',side:T.BackSide,blending:T.AdditiveBlending,transparent:true})));
 const sr=new T.Mesh(new T.TorusGeometry(2.5,.012,8,120),new T.MeshBasicMaterial({color:0x38bdf8,transparent:true,opacity:.9}));sr.rotation.x=Math.PI/2;G.add(sr);
 const rs=[[3.6,1,.35,.006,0],[4.2,-.6,-.4,-.004,1],[4.8,.3,.8,.003,2]].map(([r,rx,rz,sp,k])=>{const o=new T.Group();o.rotation.set(rx,0,rz);G.add(o);const q=[];for(let i=0;i<=128;i++){const a=i/128*6.2832;q.push(r*Math.cos(a),0,r*Math.sin(a))}
  o.add(new T.LineLoop(BG(q),new T.LineBasicMaterial({color:k==1?0xa78bfa:0x38bdf8,transparent:true,opacity:.3})));const s=new T.Group();
  if(!k){s.add(new T.Mesh(new T.BoxGeometry(.16,.07,.07),new T.MeshBasicMaterial({color:0xe6f1ff})));[-.17,.17].forEach(x=>{const m=new T.Mesh(new T.BoxGeometry(.2,.015,.1),new T.MeshBasicMaterial({color:0x38bdf8}));m.position.x=x;s.add(m)})}
  else s.add(new T.Mesh(new T.SphereGeometry(.07,12,12),new T.MeshBasicMaterial({color:k==1?0xa78bfa:0x7dd3fc})));o.add(s);return{s,r,sp,a:k*2}});
 const gp=[],gc=[],cl=new T.Color();for(let i=0;i<(innerWidth<900?1500:4500);i++){const r=Math.pow(Math.random(),.6)*90+8,a=r*.12+(i%3)*2.094+(Math.random()-.5)*.5;gp.push(Math.cos(a)*r,(Math.random()-.5)*(6-r*.04),Math.sin(a)*r-60);cl.setHSL(.55+r/400,.8,.55+Math.random()*.2);gc.push(cl.r,cl.g,cl.b)}
 const gg=BG(gp);gg.setAttribute('color',new T.Float32BufferAttribute(gc,3));const gal=new T.Points(gg,new T.PointsMaterial({size:.6,vertexColors:true,transparent:true,opacity:.75,blending:T.AdditiveBlending,depthWrite:false}));gal.rotation.set(.9,0,.3);sc.add(gal);
 const sp=[];for(let i=0;i<(innerWidth<900?500:1400);i++){const r=60+Math.random()*140,u=Math.random()*2-1,a=Math.random()*6.283,q=Math.sqrt(1-u*u);sp.push(r*q*Math.cos(a),r*u,r*q*Math.sin(a))}
 const st=new T.Points(BG(sp),new T.PointsMaterial({color:0xcfe6ff,size:.35,transparent:true,opacity:.8}));sc.add(st);
 const sh=[0,1,2].map(()=>{const l=new T.Line(new T.BufferGeometry().setFromPoints([new T.Vector3(),new T.Vector3(1.8,.55,0)]),new T.LineBasicMaterial({color:0xffffff,transparent:true,opacity:0}));l.userData={v:-Math.random()*4};sc.add(l);return l});
 let mx=0,my=0,t=0;const col=new T.Color(0x38bdf8);addEventListener('pointermove',e=>{mx=e.clientX/innerWidth-.5;my=e.clientY/innerHeight-.5});
 function size(){R.setSize(innerWidth,innerHeight,false);cam.aspect=innerWidth/innerHeight;cam.updateProjectionMatrix();const w=innerWidth>900;G.position.set(w?4:0,w?-.6:3.2,0);G.scale.setScalar(w?1:.8);R.render(sc,cam)}
 window.setQ=()=>{const q=QL();R.setPixelRatio(q==0?1:q==1?1.5:Math.min(devicePixelRatio,2));gal.visible=shell.visible=lt.visible=q>0;sh.forEach(l=>l.visible=q==2);size()};addEventListener('resize',size);setQ();
 (function loop(){if(S.set.fx&&S.set.anim&&!document.hidden&&!matchMedia('(prefers-reduced-motion:reduce)').matches){t+=.012;
  E.rotation.y+=.0012;shell.rotation.y-=.0007;shell.rotation.x+=.0004;gal.rotation.y+=.0004;st.rotation.y+=.00008;
  const h=Math.sin(t)*2.3,k=Math.sqrt(5.76-h*h)/2.5;sr.position.y=h;sr.scale.set(k,k,1);
  rs.forEach((q,k)=>{if(!k&&issA!==null){issA+=2e-5;q.a=issA}else q.a+=q.sp;q.s.position.set(q.r*Math.cos(q.a),0,q.r*Math.sin(q.a));q.s.rotation.y=-q.a});
  sh.forEach(l=>{const d=l.userData;d.v+=.015;if(d.v>1){d.v=-Math.random()*4;l.position.set(Math.random()*30-5,Math.random()*8+2,-10)}if(d.v>0){l.position.x-=.5;l.position.y-=.15}l.material.opacity=d.v>0?1-d.v:0});
  col.lerp(new T.Color(tone),.05);wire.material.color.copy(col);lt.material.color.copy(col);sr.material.color.copy(col);
  cam.position.x+=(mx*1.4-cam.position.x)*.03;cam.position.y+=(-my*.9-cam.position.y)*.03;cam.lookAt(0,0,0);R.render(sc,cam)}requestAnimationFrame(loop)})()};

/* start */
theme();side();go('dash');run();badge();
setInterval(()=>$('#clock').textContent='UTC '+new Date().toISOString().slice(11,19),1000);
addEventListener('resize',()=>{paint();wl()});
setInterval(()=>{if(!document.hidden)getISS()},10000);getISS();getSW();setInterval(getSW,120000);
setTimeout(()=>$('#boot').classList.add('off'),1600);
if(S.tourV!==2)$('[data-a="tour"]').classList.add('hint');
setTimeout(()=>{if(S.tourV!==2||/[?&]tour/.test(location.search))tourShow(0)},2600);
